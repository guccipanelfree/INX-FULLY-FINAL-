name: Settings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH="$PWD/gradle-8.2/bin:$PATH"
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/shtile app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Settings"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.shtile'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.shtile"
                  minSdk 24
                  targetSdk 34
                  versionCode 37
                  versionName "37.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <application android:allowBackup="true" android:label="Settings" android:theme="@style/Theme.MaterialComponents.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".RunnerService" android:exported="false" android:foregroundServiceType="dataSync"/>
                  <service android:name=".SafeTileService" android:exported="true" android:icon="@drawable/ic_tile_normal" android:label="Boost" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter>
                  </service>
                  <service android:name=".BrutalTileService" android:exported="true" android:icon="@drawable/ic_tile_brutal" android:label="Turbo Mode" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/shtile/RunnerService.kt <<'EOF'
          package com.example.shtile
          import android.app.*
          import android.content.Intent
          import android.os.*
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          class RunnerService : Service() {
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val ch = "runner_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.deleteNotificationChannel(ch)
                      nm.createNotificationChannel(NotificationChannel(ch, "Runner", NotificationManager.IMPORTANCE_MIN).apply { setShowBadge(false); enableLights(false); enableVibration(false); setSound(null, null) })
                  }
                  try { startForeground(1, NotificationCompat.Builder(this, ch).setContentTitle("").setContentText("").setSmallIcon(android.R.drawable.stat_notify_sync_noanim).setPriority(NotificationCompat.PRIORITY_MIN).setSilent(true).setOngoing(true).build()) } catch (e: Exception) {}
                  val action = intent?.action
                  Thread {
                      try {
                          val p = getSharedPreferences("GucciPrefs", MODE_PRIVATE)
                          val cmd = if (action == "com.example.shtile.RUN_BRUTAL") {
                              val opt = p.getString("brutal_option", "7") ?: "7"
                              "cd /data/local/tmp && (echo 2; sleep 4; echo $opt; sleep 2) | ./Gucci_brutal"
                          } else {
                              val k = p.getString("license_key", "")
                              if (k.isNullOrEmpty()) { Handler(Looper.getMainLooper()).post { Toast.makeText(applicationContext, "Save License Key first!", Toast.LENGTH_LONG).show() }; stopSelf(); return@Thread }
                              "cd /data/local/tmp && (sleep 3; echo '$k'; sleep 2) | ./Gucci_core"
                          }
                          val proc = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                          proc.inputStream.bufferedReader().readText()
                          proc.waitFor()
                      } catch (e: Exception) {}
                      try { stopForeground(true) } catch (e: Exception) {}
                      stopSelf()
                  }.start()
                  return START_NOT_STICKY
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'EOF'
          package com.example.shtile
          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          class SafeTileService : TileService() {
              override fun onStartListening() { super.onStartListening(); qsTile?.apply { label = "Boost"; state = Tile.STATE_INACTIVE; updateTile() } }
              override fun onClick() {
                  super.onClick()
                  val i = Intent(this, RunnerService::class.java).apply { action = "com.example.shtile.RUN_NORMAL" }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'EOF'
          package com.example.shtile
          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          class BrutalTileService : TileService() {
              override fun onStartListening() { super.onStartListening(); qsTile?.apply { label = "Turbo Mode"; state = Tile.STATE_INACTIVE; updateTile() } }
              override fun onClick() {
                  super.onClick()
                  val i = Intent(this, RunnerService::class.java).apply { action = "com.example.shtile.RUN_BRUTAL" }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'EOF'
          package com.example.shtile
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val status = findViewById<TextView>(R.id.status)
                  val keyInput = findViewById<EditText>(R.id.keyInput)
                  val brutalInput = findViewById<EditText>(R.id.brutalInput)
                  val driverNameText = findViewById<TextView>(R.id.driverNameText)
                  val titleText = findViewById<TextView>(R.id.titleText)
                  val subtitleText = findViewById<TextView>(R.id.subtitleText)
                  val contactAdminText = findViewById<TextView>(R.id.contactAdminText)

                  val openTelegram = {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/Gucci8240")))
                      } catch (e: Exception) {
                          Toast.makeText(this, "Telegram not installed", Toast.LENGTH_SHORT).show()
                      }
                  }
                  titleText.setOnClickListener { openTelegram() }
                  subtitleText.setOnClickListener { openTelegram() }
                  contactAdminText.setOnClickListener { openTelegram() }

                  val prefs = getSharedPreferences("GucciPrefs", Context.MODE_PRIVATE)
                  keyInput.setText(prefs.getString("license_key", ""))
                  brutalInput.setText(prefs.getString("brutal_option", "7"))
                  val map = mapOf("1" to "QX1", "2" to "GT", "3" to "rt-dev", "4" to "rt-proc", "5" to "QX(2)", "6" to "KPM", "7" to "DitPro KPM", "8" to "KMA KPM", "9" to "LDK KPM", "10" to "Paradise")
                  brutalInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) { driverNameText.text = map[s.toString().trim()] ?: "Unknown Driver" }
                      override fun afterTextChanged(s: Editable?) {}
                  })
                  driverNameText.text = map[brutalInput.text.toString()] ?: "Unknown Driver"
                  findViewById<Button>(R.id.saveKeyBtn).setOnClickListener {
                      val k = keyInput.text.toString().trim()
                      val o = brutalInput.text.toString().trim()
                      if (k.isNotEmpty() && o.isNotEmpty()) {
                          prefs.edit().putString("license_key", k).apply()
                          prefs.edit().putString("brutal_option", o).apply()
                          Toast.makeText(this, "Configuration Saved!", Toast.LENGTH_SHORT).show()
                          status.text = "✅ System Configured Successfully"
                      } else { Toast.makeText(this, "Please fill both fields", Toast.LENGTH_SHORT).show() }
                  }
                  status.text = "Status: Waiting for configuration"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0F14</color>
              <color name="bg_card">#151B23</color>
              <color name="accent_green">#00E5A0</color>
              <color name="text_primary">#FFFFFF</color>
              <color name="text_secondary">#9BA3AF</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/bg_btn_save.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="#33FFFFFF">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/accent_green"/>
                      <corners android:radius="12dp"/>
                  </shape>
              </item>
          </ripple>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/bg_main" android:fillViewport="true">
              <LinearLayout android:orientation="vertical" android:padding="24dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                  
                  <TextView android:id="@+id/titleText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="INX-LOADER PANEL" android:textColor="@color/text_primary" android:textSize="32sp" android:textStyle="bold" android:letterSpacing="0.05"/>
                  
                  <TextView android:id="@+id/subtitleText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Invisible X Loader Owner- GUCCI" android:textColor="@color/text_secondary" android:textSize="14sp" android:layout_marginTop="4dp" android:layout_marginBottom="32dp"/>
                  
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" app:cardBackgroundColor="@color/bg_card" app:cardCornerRadius="16dp" app:cardElevation="0dp" app:strokeWidth="1dp" app:strokeColor="#232A35" android:layout_marginBottom="16dp">
                      <LinearLayout android:orientation="vertical" android:padding="20dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="LICENSE KEY" android:textColor="@color/accent_green" android:textSize="12sp" android:textStyle="bold" android:letterSpacing="0.1" android:layout_marginBottom="8dp"/>
                          <EditText android:id="@+id/keyInput" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Enter your key here..." android:inputType="text" android:padding="12dp" android:background="#00000000" android:textColor="@color/text_primary" android:textColorHint="@color/text_secondary" android:textSize="16sp"/>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>
                  
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" app:cardBackgroundColor="@color/bg_card" app:cardCornerRadius="16dp" app:cardElevation="0dp" app:strokeWidth="1dp" app:strokeColor="#232A35" android:layout_marginBottom="32dp">
                      <LinearLayout android:orientation="vertical" android:padding="20dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SELECT DRIVER" android:textColor="@color/accent_green" android:textSize="12sp" android:textStyle="bold" android:letterSpacing="0.1" android:layout_marginBottom="8dp"/>
                          <EditText android:id="@+id/brutalInput" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="e.g. 7" android:inputType="number" android:padding="12dp" android:background="#00000000" android:textColor="@color/text_primary" android:textColorHint="@color/text_secondary" android:textSize="16sp"/>
                          <TextView android:id="@+id/driverNameText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="@color/accent_green" android:textSize="14sp" android:textStyle="bold" android:layout_marginTop="4dp" android:paddingStart="12dp"/>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>
                  
                  <Button android:id="@+id/saveKeyBtn" android:layout_width="match_parent" android:layout_height="56dp" android:text="SAVE CONFIGURATION" android:textColor="#000000" android:textSize="14sp" android:textStyle="bold" android:letterSpacing="0.05" android:background="@drawable/bg_btn_save" android:stateListAnimator="@null" android:elevation="4dp"/>
                  
                  <TextView android:id="@+id/status" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingTop="24dp" android:gravity="center" android:textColor="@color/text_secondary" android:textSize="12sp"/>
                  
                  <TextView android:id="@+id/contactAdminText" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingTop="40dp" android:gravity="center" android:text="Contact Admin for Help" android:textColor="@color/accent_green" android:textSize="14sp" android:textStyle="bold" android:paddingBottom="20dp"/>
              </LinearLayout>
          </ScrollView>
          EOF

          cat > app/src/main/res/drawable/ic_tile_normal.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,2L4,5v6c0,5.55 3.84,10.74 8,12 4.16,-1.26 8,-6.45 8,-12V5l-8,-3z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_tile_brutal.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Settings</string></resources>
          EOF

          gradle assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Settings-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
